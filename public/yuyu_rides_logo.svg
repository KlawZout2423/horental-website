<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="420" height="180">
  <!-- Background: transparent -->

  <!-- "yu" left -->
  <text
    x="10" y="148"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-weight="900"
    font-size="148"
    fill="white"
    letter-spacing="-4"
  >yu</text>

  <!-- "u" right (last letter) -->
  <text
    x="256" y="148"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-weight="900"
    font-size="148"
    fill="white"
    letter-spacing="-4"
  >u</text>

  <!-- Green curved arrow replacing the 3rd "y/u" slot -->
  <!-- Arrow body: curved upward sweep -->
  <g transform="translate(192, 14)">
    <!-- Curved sweep path (the green hook/swoop) -->
    <path
      d="M 60 120 C 60 120 -30 100 -30 40 C -30 -10 30 -10 50 10"
      fill="none"
      stroke="#1a7a2e"
      stroke-width="28"
      stroke-linecap="round"
    />
    <path
      d="M 60 120 C 60 120 -30 100 -30 40 C -30 -10 30 -10 50 10"
      fill="none"
      stroke="#27ae60"
      stroke-width="20"
      stroke-linecap="round"
    />
    <!-- Arrowhead pointing upper-right -->
    <polygon
      points="50,10 20,-8 68,0"
      fill="#27ae60"
      stroke="#1a7a2e"
      stroke-width="3"
      stroke-linejoin="round"
    />
  </g>

  <!-- "Rides" label — green text, lower right -->
  <rect x="316" y="120" width="92" height="34" rx="4" fill="white"/>
  <text
    x="362" y="143"
    font-family="'Arial', sans-serif"
    font-weight="700"
    font-size="22"
    fill="#1e8b38"
    text-anchor="middle"
    letter-spacing="0.5"
  >Rides</text>
</svg>
